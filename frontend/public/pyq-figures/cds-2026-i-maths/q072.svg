<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="Arial, sans-serif" font-size="13">
  <rect width="400" height="230" fill="#ffffff"/>
  <text x="20" y="20" fill="#0f172a" font-weight="bold">Shape 1: isosceles trapezium</text>
  <polygon points="50,60 140,60 170,150 20,150" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <g font-weight="bold" fill="#0f172a"><text x="42" y="54">A</text><text x="140" y="54">B</text><text x="172" y="166">C</text><text x="10" y="166">D</text></g>
  <text x="20" y="190" fill="#1d4ed8">∠ABC + ∠ADC = 180°</text>
  <text x="210" y="20" fill="#0f172a" font-weight="bold">Shape 2: parallelogram</text>
  <polygon points="250,60 350,60 320,150 220,150" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <g font-weight="bold" fill="#0f172a"><text x="242" y="54">A</text><text x="350" y="54">B</text><text x="322" y="166">C</text><text x="210" y="166">D</text></g>
  <text x="210" y="190" fill="#dc2626">∠ABC = ∠ADC</text><text x="210" y="206" fill="#dc2626">(sum can be anything)</text>
  <text x="20" y="226" fill="#475569" font-size="11">Both: AB ∥ DC and AD = BC. Statement II rules out Shape 2.</text>
</svg>
