<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" font-family="Arial, sans-serif" font-size="13">
  <rect width="360" height="150" fill="#ffffff"/>
  <line x1="30" y1="70" x2="330" y2="70" stroke="#0f172a" stroke-width="2"/>
