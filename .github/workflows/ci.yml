name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'placeholder-jwt-secret-placeholder-32-chars' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt

      - name: Run npm run verify
        run: npm run verify

      - name: Verify session resume regressions
        run: >-
          node --experimental-strip-types --test
          frontend/src/__tests__/practice_resume.test.mjs frontend/src/__tests__/question_learning_loop.test.mjs
          scripts/test-learning-continuity.cjs scripts/test-learner-intelligence.cjs scripts/test-dashboard-mode.cjs scripts/test-analytics-contract.cjs scripts/test-analytics-acceptance.cjs

      - name: Verify auth state and atomic onboarding regressions
        run: >-
          node --experimental-strip-types --test --experimental-test-isolation=none
          frontend/src/__tests__/auth_callback.test.mjs frontend/src/__tests__/auth_state.test.mjs
          scripts/test-onboarding.cjs scripts/test-onboarding-db.cjs
          scripts/test-auth-components.cjs scripts/test-auth-middleware.cjs
          scripts/test-email-otp.cjs scripts/test-otp-routing.cjs

      - name: Verify recorded migration ledger and fresh reconstruction
        run: node --test --experimental-test-isolation=none scripts/test-migration-ledger.cjs

      - name: Verify question content integrity
        run: |
          node --test scripts/test-content-integrity.cjs
          python -m pytest -q backend/tests/test_content_quality.py

      - name: Verify retired legacy profile writer
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret-placeholder-32-chars
        run: python -m pytest -q backend/tests/test_profile_compatibility.py backend/tests/test_jwt_issuer.py
