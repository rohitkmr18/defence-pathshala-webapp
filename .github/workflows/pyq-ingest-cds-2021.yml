name: PYQ Ingestion — CDS 2021 UnlockIAS

on:
  push:
    branches:
      - data/pyq-ingestion-v1-2021-pilot
    paths:
      - 'scripts/scrape-unlockias-cds-2021.py'
      - '.github/workflows/pyq-ingest-cds-2021.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/pyq-ingestion-v1-2021-pilot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned scraper dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.32.3 beautifulsoup4==4.12.3

      - name: Scrape CDS 2021 I & II
        run: python scripts/scrape-unlockias-cds-2021.py

      - name: Validate generated row counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/ingestion/cds_2021_unlockias_manifest.json')
          rows=json.loads(p.read_text())
          assert len(rows)==2, rows
          assert all(x['rows']==120 for x in rows), rows
          print(rows)
          PY

      - name: Commit generated ingestion artifacts
        run: |
          if git status --porcelain data/ingestion | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ingestion
            git commit -m "Generate CDS 2021 UnlockIAS ingestion artifacts"
            git push origin HEAD:data/pyq-ingestion-v1-2021-pilot
          else
            echo "No generated changes."
          fi
